name: Android release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  NDK_VERSION: "26.3.11579264"

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Rust 1.95 with Android target
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95"
          targets: aarch64-linux-android

      # Caches ~/.cargo registry + git and the target/ dir (compiled dependencies).
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          key: android-arm64-${{ hashFiles('android/scripts/vendor-winit.sh', 'android/patches/*.patch') }}
          cache-all-crates: true
          # Save the cache even if a later step (e.g. Gradle) fails, so Rust is never rebuilt for nothing.
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' }}

      # Prebuilt binary: avoids compiling cargo-ndk from source on every run.
      - name: Install cargo-ndk
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk

      - name: Set up Android SDK and NDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0 ndk;${{ env.NDK_VERSION }}"

      - name: Export NDK path
        run: echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      # Caches Gradle downloads and the wrapper distribution.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}

      # Step 1: Rust only. Finishes (and its cache is saved) independently of Gradle.
      - name: Build Rust library (arm64-v8a)
        run: |
          chmod +x android/scripts/build.sh
          android/scripts/build.sh --no-apk

      # Step 2: package the APK.
      - name: Build release APK
        working-directory: android
        run: |
          if [ -x ./gradlew ]; then ./gradlew assembleRelease; else gradle assembleRelease; fi

      - name: Locate APK
        id: apk
        run: |
          APK=$(find android/app/build/outputs/apk -name '*.apk' | grep -i release | head -n1)
          echo "path=$APK" >> "$GITHUB_OUTPUT"
          ls -lh "$APK"
          unzip -l "$APK" | grep '\.so'

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: effectcraft-android-arm64
          path: ${{ steps.apk.outputs.path }}

      - name: Create GitHub release (tag builds only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.apk.outputs.path }}
